{#- Split auth layout: gradient story panel (lg+) beside the form card. Blocks: aside, card -#}
{% extends "base.html" %}
{% block content %}
<div class="grid items-stretch gap-8 lg:min-h-[calc(100vh-15rem)] lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] xl:gap-12">
  <aside class="auth-aside hidden lg:flex" aria-label="About {{ app.name }}">
    <div class="relative z-10 flex w-full flex-col">
      <a href="/" class="inline-flex items-center gap-2.5 text-[17px] font-semibold tracking-tight text-white">
        <span class="auth-aside-icon !size-9 !rounded-xl">{{ icon("activity", "size-4") }}</span>{{ app.name }}
      </a>
      <div class="mt-auto pt-16">{% block aside %}{% endblock %}</div>
    </div>
  </aside>
  <section class="flex min-w-0 items-center justify-center py-2 lg:py-8">
    <div class="w-full max-w-md animate-fade-up">{% block card %}{% endblock %}</div>
  </section>
</div>
{% endblock %}
