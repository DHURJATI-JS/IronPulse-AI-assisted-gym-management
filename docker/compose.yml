# IronPulse local infrastructure - PostgreSQL + pgvector, Redis, the Gemma failsafe (Ollama) and the Kokoro voice.
#
# Always run it from the project folder with the project's .env (passwords are generated by the setup scripts):
#   docker compose --env-file .env -f docker/compose.yml up -d db redis                # database + sessions
#   docker compose --env-file .env -f docker/compose.yml up -d ollama ollama-pull      # Gemma failsafe (~3.3 GB once)
#   docker compose --env-file .env -f docker/compose.yml --profile voice up -d kokoro  # live-coach voice (TTS)
#   docker compose --env-file .env -f docker/compose.yml --profile app up -d --build   # the app itself in Docker
#   NVIDIA GPU for Ollama/Kokoro: add  -f docker/compose.gpu.yml  after the first -f
#
# Ports are bound to 127.0.0.1 only (nothing is exposed to your network). Data lives in named volumes:
# `docker compose ... down` keeps it, `down -v` deletes it.

name: ironpulse

services:
  # ----------------------------------------------------------------- PostgreSQL 17 + pgvector (port 5433 on the host)
  db:
    # pgvector 0.8.7 on PostgreSQL 17 - pinned for reproducible installs (floating alternative: pgvector/pgvector:pg17)
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ----------------------------------------------------------------- Redis 7 session store (port 6380 on the host)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-change-me}   # lets the healthcheck's redis-cli authenticate
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ----------------------------------------------------------------- Gemma failsafe: Ollama (OpenAI-compatible /v1 on 11434)
  # The app reaches it at AI_DOCKER_BASE_URL: http://localhost:11434/v1 when the app runs on this computer (./run.sh
  # starts this container by itself), http://ollama:11434/v1 when the app runs in this compose project (--profile app
  # sets that). gemma3:4b (Q4_K_M, 3.3 GB) with the 8k context needs about 4.5 GB of RAM: give Docker Desktop's VM at
  # least 8 GB; OLLAMA_MEMORY_LIMIT / OLLAMA_MEMORY_RESERVATION (.env) change the limits for a bigger AI_DOCKER_MODEL.
  ollama:
    # Ollama 0.40.15 (November 2026) - pinned; bump deliberately after testing gemma3 with the new release
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"         # keep Gemma loaded so failover answers immediately
      OLLAMA_CONTEXT_LENGTH: "8192"    # same 8k context the prompts are written for
      OLLAMA_NUM_PARALLEL: "1"         # one answer at a time = the app's AI_DOCKER_MAX_CONCURRENCY=1
      OLLAMA_MAX_LOADED_MODELS: "1"    # never a second model in memory next to Gemma
      OLLAMA_MAX_QUEUE: "64"           # requests Ollama itself queues beyond that (the app's own queue comes first)
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama           # the downloaded models survive restarts and `down` (not `down -v`)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-6g}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-4g}
          # NVIDIA GPU (Linux, or Windows with WSL 2 + the NVIDIA driver): uncomment these 4 lines - or add
          # -f docker/compose.gpu.yml to the docker compose command instead
          # devices:
          #   - driver: nvidia
          #     count: all
          #     capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"                # Ollama logs every request: never let them fill the disk
        max-file: "3"

  # one-shot: download AI_DOCKER_MODEL into the ollama volume - skipped when it is already there (so a restart works
  # offline); exits when done, safe to re-run. ./run.sh runs it in the background.
  ollama-pull:
    image: ollama/ollama:0.40.15
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL: "${AI_DOCKER_MODEL:-gemma3:4b}"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$MODEL" >/dev/null 2>&1 && echo "$$MODEL is already pulled" || ollama pull "$$MODEL"']
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ----------------------------------------------------------------- Kokoro text-to-speech for the live coach (port 8880)
  kokoro:
    # Kokoro-FastAPI v0.9.2 (CPU) - OpenAI-compatible /v1/audio/speech; the app uses the browser voice when it's down
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.2
    profiles: ["voice"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"

  # ----------------------------------------------------------------- IronPulse itself (optional: --profile app)
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ironpulse-app:local
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-10000}
      DATABASE_URL: postgresql+asyncpg://ironpulse:${APP_DB_PASSWORD:-change-me-app}@db:5432/ironpulse
      DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-change-me-postgres}@db:5432/postgres
      TEST_DATABASE_URL: postgresql+asyncpg://ironpulse:${APP_DB_PASSWORD:-change-me-app}@db:5432/ironpulse_test
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      AI_DOCKER_BASE_URL: http://ollama:11434/v1
      TTS_BASE_URL: http://kokoro:8880/v1
      TESSERACT_CMD: /usr/bin/tesseract
    # create the role/database/extensions on first start, then serve
    command: ["sh", "-c", "python scripts/manage.py init-db --wait 60 && exec python -m app"]
    ports:
      - "127.0.0.1:${PORT:-10000}:${PORT:-10000}"
    volumes:
      - appdata:/app/var
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  ollama:
  appdata:
